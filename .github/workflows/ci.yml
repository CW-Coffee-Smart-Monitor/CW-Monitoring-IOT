name: PlatformIO CI

on:
  push:
    branches: main
  pull_request:
    branches: main
  workflow_dispatch:

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies & Tools
        run: |
          python -m pip install --upgrade pip
          pip install . clang-format

      - name: Run Clang-Format Style Check
        run: |
          clang-format --dry-run --Werror src/*.cpp include/*.h lib/*/*.h lib/*/*.cpp test/*/*.cpp

      - name: Run PlatformIO Static Analysis (cppcheck & clang-tidy)
        run: |
          pio check -e esp32dev --skip-packages

  test:
    name: Run Native Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-native-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-native-

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run Native Unit Tests
        run: |
          pio test -e native

  build:
    name: Build ESP32 Firmware
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-esp32-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-esp32-

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Compile ESP32 Firmware
        run: |
          pio run -e esp32dev

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: .pio/build/esp32dev/firmware.bin
          if-no-files-found: error
