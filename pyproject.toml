[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cw-monitoring-iot"
version = "0.1.0"
description = "Smart Coworking Space / Desk Monitoring System powered by ESP32 and PlatformIO"
readme = "README.md"
requires-python = ">=3.11, <3.14"
dependencies = [
    "platformio>=6.1.16",
]

[project.optional-dependencies]
dev = [
    "pre-commit==3.8.0",
    "clang-format==18.1.8",
]
